[project]
name = "select-live"
version = "2.0.0"
description = "Home Assistant integration for Selectronic SP PRO inverters via local connection to select.live device"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant",
    "mypy",
    "pyright",
    "ruff",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.ruff]
target-version = "py314"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["custom_components"]
